name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Kotlin)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wave
          POSTGRES_PASSWORD: wave_test
          POSTGRES_DB: wave_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wave -d wave_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (with real Postgres and Redis)
        env:
          WAVE_TEST_DATABASE_URL: postgres://wave:wave_test@localhost:5432/wave_test
          WAVE_TEST_REDIS_URL: redis://localhost:6379/1
        run: ./gradlew --no-daemon test installDist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  scraper:
    name: Data pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: mypy wave_scraper
      - run: pytest -q
      - name: Catalog snapshot matches the backend
        run: |
          python tools/export_catalog.py ../backend/src/main/resources/catalog
          git diff --exit-code wave_scraper/data/catalog.json

  mobile:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - name: Android APK (release, unsigned unless key.properties is provided)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: wave-android
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Kubernetes manifests (strict schema validation, CRDs included)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            infra/k8s/*.yaml
      - name: docker-compose file
        run: |
          cp infra/.env.example infra/.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/' infra/.env
          docker compose -f infra/docker-compose.yml --profile pipeline --profile monitoring config --quiet
      - name: Load balancer configuration (nginx -t)
        run: |
          docker run --rm \
            --add-host backend-1:127.0.0.1 --add-host backend-2:127.0.0.1 --add-host backend-3:127.0.0.1 --add-host web:127.0.0.1 \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/proxy_backend.conf:/etc/nginx/proxy_backend.conf:ro" \
            nginx:1.29-alpine nginx -t

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, scraper, mobile]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: wave-backend, context: backend }
          - { name: wave-scraper, context: scraper }
          - { name: wave-web, context: mobile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
