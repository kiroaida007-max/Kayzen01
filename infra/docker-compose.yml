# WAVE on a single host: edge load balancer → 3 API replicas, Postgres, Redis, web app and the
# data pipeline. For the 100k-concurrent-user target use Kubernetes (infra/k8s), which autoscales.
#
#   cp infra/.env.example infra/.env   # fill in the secrets
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml --profile pipeline up -d     # + scrapers
#   docker compose -f infra/docker-compose.yml --profile monitoring up -d   # + Prometheus
name: wave

x-backend: &backend
  build: ../backend
  image: wave/backend:${WAVE_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    WAVE_ENV: prod
    DATABASE_URL: postgres://wave:${POSTGRES_PASSWORD}@postgres:5432/wave
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    DB_POOL_SIZE: "20"
    WAVE_TRUSTED_PROXY_HOPS: "1"
    JAVA_OPTS: "-XX:+ExitOnOutOfMemoryError -Xmx1g"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
    interval: 10s
    timeout: 3s
    start_period: 60s
    retries: 3
  deploy:
    resources:
      limits: { cpus: "2", memory: 1536M }
  networks: [backend, data]
  stop_grace_period: 30s

services:
  lb:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_backend.conf:/etc/nginx/proxy_backend.conf:ro
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    depends_on: [backend-1, backend-2, backend-3, web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/lb-health"]
      interval: 10s
      timeout: 3s
    networks: [edge, backend]

  backend-1: *backend
  backend-2: *backend
  backend-3: *backend

  web:
    build: ../mobile
    image: wave/web:${WAVE_VERSION:-latest}
    restart: unless-stopped
    environment:
      # WebSocket origin for the Content-Security-Policy of the web app.
      WAVE_CONNECT_SRC: ${WAVE_WS_ORIGIN:-}
    networks: [backend]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wave
      POSTGRES_USER: wave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    command: >
      postgres -c max_connections=200 -c shared_buffers=512MB -c effective_cache_size=1536MB
      -c synchronous_commit=on -c wal_compression=on -c log_min_duration_statement=500
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wave -d wave"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Holds and idempotency keys must never be evicted: noeviction + AOF persistence.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}
      --appendonly yes --appendfsync everysec --maxmemory 1gb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]

  # ---------------------------------------------------------------- data pipeline (profile)
  scraper:
    build: ../scraper
    image: wave/scraper:${WAVE_VERSION:-latest}
    profiles: [pipeline]
    restart: unless-stopped
    environment:
      WAVE_INGEST_URL: http://lb:8081
      WAVE_INGEST_KEY_ID: ${WAVE_INGEST_KEY_ID:-scraper}
      WAVE_INGEST_SECRET: ${WAVE_INGEST_SECRET}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    # Timetables every 30 minutes, official rates every 6 hours.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        while true; do
          if [ $$((i % 12)) -eq 0 ]; then wave-scraper rates || true; fi
          wave-scraper crawl || true
          i=$$((i + 1))
          sleep 1800
        done
    depends_on: [lb]
    networks: [backend]

  ais:
    image: wave/scraper:${WAVE_VERSION:-latest}
    profiles: [ais]
    restart: unless-stopped
    environment:
      WAVE_INGEST_URL: http://lb:8081
      WAVE_INGEST_KEY_ID: ${WAVE_INGEST_KEY_ID:-scraper}
      WAVE_INGEST_SECRET: ${WAVE_INGEST_SECRET}
    command: ["ais", "--udp", "0.0.0.0:10110"]
    ports: ["10110:10110/udp"]
    networks: [backend]

  # ---------------------------------------------------------------- monitoring (profile)
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9091:9090"]
    networks: [backend]

volumes:
  pgdata:
  redisdata:

networks:
  edge:
  backend:
  # Databases are only reachable from the API containers.
  data:
    internal: true
