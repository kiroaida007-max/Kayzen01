# Alerts for the WAVE API (Micrometer metrics on the management port). Shared by docker-compose
# and the Kubernetes PrometheusRule (infra/k8s/monitoring.yaml).
groups:
  - name: wave-api
    rules:
      - alert: WaveHighErrorRate
        expr: |
          sum(rate(ktor_http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(ktor_http_server_requests_seconds_count[5m])), 1) > 0.02
        for: 5m
        labels: { severity: page }
        annotations:
          summary: More than 2 % of API requests fail with 5xx

      - alert: WaveSearchSlow
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(ktor_http_server_requests_seconds_bucket{route=~".*search.*"}[5m]))) > 1
        for: 10m
        labels: { severity: page }
        annotations:
          summary: Search p99 above 1 s for 10 minutes

      - alert: WaveDependencyDown
        # Search keeps working without Postgres/Redis, booking does not: page quickly.
        expr: min by (dependency) (wave_dependency_up) == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.dependency }} unreachable: bookings fail with 503"

      - alert: WaveInstanceDown
        expr: up{job="wave-backend"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} is not scraped"

      - alert: WaveHeapPressure
        expr: |
          sum by (instance) (jvm_memory_used_bytes{area="heap"}) / sum by (instance) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} heap above 90 %"

      - alert: WaveNoLiveData
        # Scrapers run every 30 minutes: 3 h without an accepted crossing means the pipeline is
        # broken and search is back to reference fares.
        expr: sum(increase(wave_ingest_sailings_total{result="accepted"}[3h])) == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: No scraped sailings ingested for 3 hours

      - alert: WavePaymentsFailing
        expr: |
          sum(increase(wave_payments_total{event="declined"}[30m]))
            / clamp_min(sum(increase(wave_payments_total{event=~"approved|declined"}[30m])), 1) > 0.5
        for: 15m
        labels: { severity: page }
        annotations:
          summary: More than half of card payments declined (SATIM / Stripe outage?)
