# PostgreSQL with CloudNativePG: 1 primary + 2 synchronous-capable replicas across zones,
# continuous WAL archiving, and PgBouncer poolers (transaction mode) for writes and reads.
# Requires the CloudNativePG operator (https://cloudnative-pg.io). A managed Postgres
# (Cloud SQL, RDS, Azure Flexible Server) is an equally good choice: point DATABASE_URL at it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wave-db
  namespace: wave
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  primaryUpdateStrategy: unsupervised
  minSyncReplicas: 1
  maxSyncReplicas: 1
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 2GB
      effective_cache_size: 6GB
      work_mem: 16MB
      log_min_duration_statement: "500"
  bootstrap:
    initdb:
      database: wave
      owner: wave
      secret: { name: wave-db-app }
  storage:
    size: 100Gi
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { memory: 8Gi }
  affinity:
    topologyKey: topology.kubernetes.io/zone
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://wave-backups/postgres
      s3Credentials:
        accessKeyId: { name: wave-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: wave-backup-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: wave-db-daily
  namespace: wave
spec:
  schedule: "0 30 1 * * *"
  cluster: { name: wave-db }
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: wave-db-pooler-rw
  namespace: wave
spec:
  cluster: { name: wave-db }
  instances: 3
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "5000"
      default_pool_size: "60"
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: wave-db-pooler-ro
  namespace: wave
spec:
  cluster: { name: wave-db }
  instances: 2
  type: ro
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "5000"
      default_pool_size: "60"
