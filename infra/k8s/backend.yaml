apiVersion: v1
kind: ServiceAccount
metadata:
  name: wave-backend
  namespace: wave
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wave-backend
  namespace: wave
  labels: { app.kubernetes.io/name: wave-backend, app.kubernetes.io/part-of: wave }
spec:
  # The HPA owns the replica count; this is only the first rollout.
  replicas: 6
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: wave-backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wave-backend, app.kubernetes.io/part-of: wave }
    spec:
      serviceAccountName: wave-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # Spread replicas over zones and nodes so one failure never takes most of the API.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: wave-backend } }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: wave-backend } }
      containers:
        - name: api
          image: ghcr.io/kiroaida007-max/wave-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: wave-config }
            - secretRef: { name: wave-secrets }
          env:
            - name: JAVA_OPTS
              value: "-XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=70"
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { memory: 1536Mi }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Leave the load balancer's endpoints before Netty stops accepting connections.
            preStop:
              sleep: { seconds: 10 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: wave-backend
  namespace: wave
  labels: { app.kubernetes.io/name: wave-backend }
spec:
  selector: { app.kubernetes.io/name: wave-backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 9090, targetPort: management }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wave-backend
  namespace: wave
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: wave-backend }
  # ~1,500 search-heavy req/s per pod at 60 % CPU (docs/scaling-100k.md): 6 pods carry normal
  # days, 40 pods cover summer peaks with 100k+ concurrent travellers.
  minReplicas: 6
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 6, periodSeconds: 30 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 20, periodSeconds: 60 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wave-backend
  namespace: wave
spec:
  minAvailable: 75%
  selector:
    matchLabels: { app.kubernetes.io/name: wave-backend }
