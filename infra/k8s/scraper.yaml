---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wave-scraper-discovery
  namespace: wave
spec:
  schedule: "0 4 * * 1"
  timeZone: Africa/Algiers
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels: { app.kubernetes.io/name: wave-scraper, app.kubernetes.io/part-of: wave }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: discover
              image: ghcr.io/kiroaida007-max/wave-scraper:latest
              command: ["/bin/sh", "-c"]
              args:
                - for op in AF CL BAL GNV NE ATM; do wave-scraper discover --operator $op || true; done
              env:
                - { name: WAVE_INGEST_URL, value: "http://wave-backend:8080" }
                - name: WAVE_INGEST_KEY_ID
                  valueFrom: { secretKeyRef: { name: wave-secrets, key: WAVE_INGEST_KEY_ID } }
                - name: WAVE_INGEST_SECRET
                  valueFrom: { secretKeyRef: { name: wave-secrets, key: WAVE_INGEST_SECRET } }
                - name: FIRECRAWL_API_KEY
                  valueFrom: { secretKeyRef: { name: wave-secrets, key: FIRECRAWL_API_KEY, optional: true } }
                - { name: WAVE_SOURCES, value: /config/sources.yaml }
              resources:
                requests: { cpu: 500m, memory: 1Gi }
                limits: { memory: 2Gi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: sources, mountPath: /config }
                - { name: dshm, mountPath: /dev/shm }
          volumes:
            - name: sources
              configMap: { name: wave-scraper-sources, optional: true }
            - name: dshm
              emptyDir: { medium: Memory, sizeLimit: 512Mi }
