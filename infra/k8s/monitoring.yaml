# Prometheus Operator resources. The alert rules match infra/prometheus/alerts.yml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wave-backend
  namespace: wave
  labels: { release: prometheus }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: wave-backend }
  endpoints:
    - port: management
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wave-alerts
  namespace: wave
  labels: { release: prometheus }
spec:
  groups:
    - name: wave-api
      rules:
        - alert: WaveHighErrorRate
          expr: |
            sum(rate(ktor_http_server_requests_seconds_count{status=~"5.."}[5m]))
              / clamp_min(sum(rate(ktor_http_server_requests_seconds_count[5m])), 1) > 0.02
          for: 5m
          labels: { severity: page }
          annotations: { summary: More than 2 % of API requests fail with 5xx }
        - alert: WaveDependencyDown
          expr: min by (dependency) (wave_dependency_up) == 0
          for: 1m
          labels: { severity: page }
          annotations: { summary: "{{ $labels.dependency }} unreachable: bookings fail with 503" }
        - alert: WaveSearchSlow
          expr: histogram_quantile(0.99, sum by (le) (rate(ktor_http_server_requests_seconds_bucket{route=~".*search.*"}[5m]))) > 1
          for: 10m
          labels: { severity: page }
          annotations: { summary: Search p99 above 1 s for 10 minutes }
        - alert: WaveAutoscalerAtMax
          expr: kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="wave-backend"} >= kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="wave-backend"}
          for: 15m
          labels: { severity: warning }
          annotations: { summary: API autoscaler pinned at its maximum; raise maxReplicas or add nodes }
        - alert: WaveNoLiveData
          expr: sum(increase(wave_ingest_sailings_total{result="accepted"}[3h])) == 0
          for: 30m
          labels: { severity: warning }
          annotations: { summary: No scraped sailings ingested for 3 hours }
        - alert: WavePaymentsFailing
          expr: |
            sum(increase(wave_payments_total{event="declined"}[30m]))
              / clamp_min(sum(increase(wave_payments_total{event=~"approved|declined"}[30m])), 1) > 0.5
          for: 15m
          labels: { severity: page }
          annotations: { summary: More than half of card payments declined }
