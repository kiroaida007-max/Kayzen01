# WAVE edge load balancer (docker-compose / single-host deployments).
# Kubernetes uses ingress-nginx with the same limits (infra/k8s/ingress.yaml).
worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # Slow-client protection: small bodies (the API caps them too) and short header/body timeouts.
    client_max_body_size 512k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
        '"upstream":"$upstream_addr","urt":"$upstream_response_time","rid":"$request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout json buffer=64k flush=5s;
    error_log /dev/stderr warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/wasm;

    # Budgets per IP *and* app install (X-Wave-Client): Algerian mobile carriers put thousands of
    # subscribers behind one public IP (CGNAT), so per-IP buckets alone would throttle real users.
    # The per-IP ceiling bounds what a client inventing ids can gain.
    map $http_x_wave_client $wave_client {
        "~^[A-Za-z0-9-]{16,64}$" $http_x_wave_client;
        default "";
    }
    map $wave_client $rate_key {
        ""      $binary_remote_addr;
        default "$binary_remote_addr$wave_client";
    }
    limit_req_zone $rate_key zone=api:50m rate=20r/s;
    limit_req_zone $rate_key zone=search:50m rate=5r/s;
    limit_req_zone $rate_key zone=booking:20m rate=1r/s;
    # Load generators of the performance environment skip the per-IP ceiling (an empty key is
    # never limited). Keep this list to private test ranges.
    geo $loadgen {
        default 0;
        # 10.42.0.0/16 1;
    }
    map $loadgen $ceiling_key {
        1       "";
        default $binary_remote_addr;
    }
    limit_req_zone $ceiling_key zone=ip_ceiling:20m rate=400r/s;
    limit_conn_zone $binary_remote_addr zone=perip:20m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        # Least connections: a pod busy with a slow payment callback gets fewer new requests.
        least_conn;
        server backend-1:8080 max_fails=3 fail_timeout=10s;
        server backend-2:8080 max_fails=3 fail_timeout=10s;
        server backend-3:8080 max_fails=3 fail_timeout=10s;
        keepalive 256;
        keepalive_timeout 60s;
    }

    upstream web {
        server web:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080 reuseport backlog=4096;
        server_name _;
        # TLS terminates at the cloud load balancer; on a bare VM add "listen 443 ssl" + certificates here.

        limit_conn perip 1000;
        add_header X-Request-Id $request_id always;

        location = /lb-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Machine-to-machine and monitoring endpoints never leave the private network.
        location /internal/ { return 404; }
        location /metrics { return 404; }

        location = /api/v1/search {
            limit_req zone=search burst=20 nodelay;
            limit_req zone=ip_ceiling burst=800 nodelay;
            include /etc/nginx/proxy_backend.conf;
        }

        location /api/v1/bookings {
            limit_req zone=booking burst=5 nodelay;
            limit_req zone=ip_ceiling burst=800 nodelay;
            include /etc/nginx/proxy_backend.conf;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            limit_req zone=ip_ceiling burst=800 nodelay;
            include /etc/nginx/proxy_backend.conf;
        }

        location /health/ {
            access_log off;
            include /etc/nginx/proxy_backend.conf;
        }

        # Live map: one long-lived WebSocket per open map screen.
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }

    # Private listener for the data pipeline (never published): signed ingestion with failover.
    server {
        listen 8081;
        server_name _;
        client_max_body_size 8m;

        location /internal/ {
            include /etc/nginx/proxy_backend.conf;
        }

        location / {
            return 404;
        }
    }
}
